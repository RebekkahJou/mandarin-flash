plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.mandarinflash'
version = '1.0.0'

expoModule {
  v2 true
}

android {
  namespace "expo.modules.playassetdelivery"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Asks the Play Store app to download on-demand asset packs; this app itself never goes online.
  implementation 'com.google.android.play:asset-delivery:2.3.0'
}
